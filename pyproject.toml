[project]
name = "pythainav"
version = "0.4.0"
description = "a Python interface to pull thai mutual fund NAV"
authors = [{ name = "Nutchanon Ninyawee", email = "me@nutchanon.org" }]
maintainers = [{ name = "Nutchanon Ninyawee", email = "me@nutchanon.org" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "furl>=2.1",
    "dateparser>=1.0",
    "requests>=2.22",
]

[project.urls]
Repository = "https://github.com/ninyawee/pythainav"
Documentation = "https://pythainav.nutchanon.org/"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "pandas>=2",
    "ruff>=0.6",
    "mkdocs>=1.5",
    "mkdocs-material>=9",
    "mkautodoc>=0.2",
    "pymdown-extensions>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pythainav"]

[tool.ruff]
line-length = 80
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# B019: lru_cache on the Source methods is a pre-existing design choice
#       (caching per source instance) — tracked separately, not in scope here.
ignore = ["E501", "B019"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers"
markers = [
    "network: hits the live Finnomena API (excluded in CI via -m 'not network')",
]
